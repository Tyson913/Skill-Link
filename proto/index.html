<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="" alt="">
        <div class="header-left">
            <button id="loginBtn">Login</button>
            <button id="signupBtn">Signup</button>
        </div>
    </header>

    <main>
        <section id="landingPage">
            <div class="landing-page-container">
                <div class="hero-section">
                    <h1>Every Problem Has a Solution.</h1>
                    <p>Find the right service to get it solved.</p>
                </div>
                <button id="main-page-trigger">Get Started</button>
            </div>
        </section>


        <section id="mainPage" style="display: none;">
            <div class="main-page-container">
                <div class="main-page-center">
                    <span class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text">
                    </span>
                </div>

                <div class="category-section">
                    <h2 id="catLabel">Categories</h2>
                    <div class="service-category-container">
                        <span><i data-lucide="wrench"></i> Home & Repair</span>
                        <span><i data-lucide="laptop"></i> Technology</span>
                        <span><i data-lucide="car"></i> Automotive</span>
                        <span><i data-lucide="broom"></i> Cleaning</span>
                        <span><i data-lucide="sparkles"></i> Beauty & Wellness</span>
                        <span><i data-lucide="book-open"></i> Education</span>
                        <span><i data-lucide="palette"></i> Creative</span>
                        <span><i data-lucide="hard-hat"></i> Construction</span>
                        <span><i data-lucide="truck"></i> Delivery & Moving</span>
                        <span><i data-lucide="briefcase-business"></i> Professional Services</span>
                    </div>
                </div>


                <div class="result">

                </div>

                <div class="profilePage">

                </div>
            </div>
        </section>

        <div class="auth-form-container" id="authFormContainer">
            <div class="auth-form-overlay" id="authFormOverlay"></div>

            <div class="auth-form-box">
                <button type="button" class="auth-form-close" id="authFormClose" aria-label="Close">&times;</button>

                <form id="loginForm" class="auth-form" novalidate>
                    <h2>Login</h2>

                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit">Login</button>

                    <p class="auth-form-switch">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>
                </form>

                <form id="signupForm" class="auth-form" novalidate>
                    <h2>Sign Up</h2>

                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" name="password" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" name="confirmPassword" autocomplete="new-password" required>
                    </div>

                    <button type="submit">Sign Up</button>

                    <p class="auth-form-switch">Already have an account? <a href="#" id="switchToLogin">Login</a></p>
                </form>
            </div>
        </div>
    </main>
    <footer>
    </footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="main.js"></script>
</body>
</html>
